<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juno — Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/components.css">
<script src="../../Controllers/themeController.js"></script>
</head>
<body>
 
<div class="app-shell">
 
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">Juno</div>
      <div class="sidebar-header-icons">
        <button class="icon-btn-top" type="button" aria-label="Search"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.7"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
        <button class="icon-btn-top" type="button" aria-label="Sidebar layout"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.6"/><path d="M9 4v16" stroke="currentColor" stroke-width="1.6"/></svg></button>
      </div>
    </div>
 
    <nav class="sidebar-nav">
      <button class="sidebar-item-active" type="button">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" style="flex:none"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <span>New chat</span>
      </button>
      <a class="sidebar-item" href="../Projects/index.html">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" style="flex:none"><path d="M3 8a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <span>Projects</span>
      </a>
      <button class="sidebar-item" type="button">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" style="flex:none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6"/><path d="M12 7.5V12l3 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span>Scheduled</span>
      </button>
    </nav>
 
    <div class="sidebar-label">RECENTS</div>
    <div id="sidebar-recents" style="display:flex;flex-direction:column;gap:2px;margin-bottom:8px"></div>
    <div id="sidebar-recent-chats" style="display:flex;flex-direction:column;gap:1px"></div>
 
    <div class="sidebar-spacer"></div>
 
    <div class="upgrade-card">
      <div class="upgrade-card-title">Upgrade to unlock more</div>
      <div class="upgrade-card-desc">Access higher limits, Pro models, and more.</div>
    </div>
 
    <div class="profile-row">
      <button class="profile-btn" id="profile-btn" type="button">
        <div class="profile-avatar"></div>
        <span class="profile-email"></span>
      </button>
      <div class="profile-menu" id="profile-menu">
        <div class="profile-menu-email"></div>
        <div class="menu-item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg><span>Settings</span></div>
        <div class="menu-item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18z" stroke="currentColor" stroke-width="1.3"/></svg><span>Language</span></div>
        <div class="menu-item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.5-2 1.8-2 3.5M12 17h.01" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span>Get help</span></div>
        <div class="menu-divider"></div>
        <div class="menu-item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 19V5M6 11l6-6 6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Upgrade plan</span></div>
        <div class="menu-item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 4v12M7 12l5 5 5-5M4 20h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Get apps and extensions</span></div>
        <div class="menu-item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/><path d="M12 8h.01M11 12h1v5h1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Learn more</span></div>
        <div class="menu-divider"></div>
        <div class="menu-item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Log out</span></div>
      </div>
    </div>
  </aside>
 
  <main class="main-wrap">
    <div class="topbar">
      <div style="flex:1"></div>
      <button class="icon-btn" id="files-toggle" type="button" aria-label="Open files panel"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h10M4 18h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    </div>
 
<div style="flex:1;min-width:0;overflow-y:auto;display:flex;flex-direction:column">
 
    <div
        id="chat-history"
        class="juno-content"
        style="
            flex:1;
            padding-top:32px;
            padding-bottom:20px;
            overflow-y:auto;
            display:flex;
            flex-direction:column;
            gap:18px;
        "
    >
 
        <div class="section-label">
            Start with an agent
        </div>
 
        <div class="tiles-grid" id="agent-tiles"></div>
 
    </div>
 
</div>
 
    <div class="juno-content" style="flex:none;padding-top:8px;padding-bottom:24px">
      <div class="composer">
        <textarea
    id="chat-input"
    placeholder="Ask anything..."
    rows="1"
></textarea>
        <div class="composer-controls">
          <button class="icon-btn-30" type="button" aria-label="Add"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
          <button class="icon-btn-30" type="button" aria-label="Tools"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="7" height="7" rx="1.3" stroke="currentColor" stroke-width="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.3" stroke="currentColor" stroke-width="1.5"/><rect x="3" y="15" width="7" height="7" rx="1.3" stroke="currentColor" stroke-width="1.5"/><rect x="14" y="15" width="7" height="7" rx="1.3" stroke="currentColor" stroke-width="1.5"/></svg></button>
          <button class="icon-btn-30" type="button" aria-label="Voice"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zM6 11v1a6 6 0 0 0 12 0v-1M12 18v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
          <div class="model-pill">Juno 2.5</div>
          <div class="composer-spacer"></div>
          <button class="send-btn" id="send-btn" type="button" aria-label="Send message">
            <svg class="send-arrow" width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M12 19V5M6 11l6-6 6 6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <div class="send-dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
          </button>
        </div>
      </div>
    </div>
  </main>
 
  <aside class="rpanel files" id="files-panel" style="display:none">
    <div class="rpanel-header">
      <div class="rpanel-title">Files</div>
      <button class="rpanel-close" id="files-close" type="button" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
    </div>
    <div class="rpanel-empty">
      <div class="rpanel-empty-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M14 3v5h5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></div>
      <div class="rpanel-empty-title">No files yet</div>
      <div class="rpanel-empty-desc">Files created during this conversation will appear here.</div>
    </div>
  </aside>
 
  <aside class="rpanel pdf" id="pdf-panel" style="display:none">
    <div class="rpanel-header pdf-header">
      <div class="rpanel-title">PDF Preview</div>
      <div class="pdf-header-actions">
        <button class="pdf-icon-btn" type="button" aria-label="Download"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 19h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="pdf-icon-btn" type="button" aria-label="Fullscreen"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="pdf-icon-btn" type="button" aria-label="Close" onclick="HomeController.closePdfPanel()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      </div>
    </div>
    <div class="pdf-body"><div class="pdf-answer">Answer</div></div>
  </aside>
 
</div>
 
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="../../Models/sidebarModel.js"></script>
<script src="../../Models/agentsModel.js"></script>
<script src="../../Controllers/sidebarController.js"></script>
<script src="../../Controllers/homeController.js"></script>
</body>
</html>
