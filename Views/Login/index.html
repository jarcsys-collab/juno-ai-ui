<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juno v12 - Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/components.css">
<script src="../../Controllers/themeController.js"></script>
</head>
<body>
  <main class="login-page">
    <section class="login-panel" aria-labelledby="login-title">
      <div class="login-brand">
        <div class="login-mark">J</div>
        <span>Juno</span>
      </div>

      <div class="login-card">
        <h1 id="login-title">Log in</h1>
        <p>Welcome back. Enter your details to continue.</p>
        <form id="login-form" class="login-form">
          <label for="login-username">Email</label>
          <input id="login-username" name="username" type="text" autocomplete="username" placeholder="Email address" required>

          <div class="login-label-row">
            <label for="login-password">Password</label>
            <button class="login-link" type="button">Forgot password?</button>
          </div>
          <div class="login-password-wrap">
            <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Password" required>
            <button class="login-eye" id="login-eye" type="button" aria-label="Show password">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="2.5" stroke="currentColor" stroke-width="1.5"/></svg>
            </button>
          </div>

          <div class="login-options">
            <label class="login-check">
              <input type="checkbox">
              <span>Remember me</span>
            </label>
          </div>

          <div class="login-error" id="login-error" role="alert"></div>

          <button class="login-submit" type="submit">Log in</button>

          <div class="login-divider"><span>or connect with</span></div>

          <div class="social-login-grid">
            <button class="social-btn" type="button" data-provider="Google" aria-label="Continue with Google">
              <span class="social-mark google-logo" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 18 18">
                  <path fill="#4285F4" d="M17.6 9.2c0-.6-.1-1.1-.2-1.6H9v3.1h4.8c-.2 1-.8 1.9-1.7 2.5v2h2.7c1.7-1.5 2.8-3.6 2.8-6z"/>
                  <path fill="#34A853" d="M9 18c2.4 0 4.4-.8 5.9-2.1l-2.7-2c-.8.5-1.8.8-3.1.8-2.3 0-4.3-1.6-5-3.7H1.2v2.1C2.7 16 5.6 18 9 18z"/>
                  <path fill="#FBBC05" d="M4 11c-.2-.6-.3-1.2-.3-2s.1-1.4.3-2V4.9H1.2C.4 6.1 0 7.5 0 9s.4 2.9 1.2 4.1L4 11z"/>
                  <path fill="#EA4335" d="M9 3.6c1.3 0 2.5.4 3.4 1.3l2.5-2.5C13.4.9 11.4 0 9 0 5.6 0 2.7 2 1.2 4.9L4 7c.7-2.1 2.7-3.4 5-3.4z"/>
                </svg>
              </span>
              <span>Google</span>
            </button>
            <button class="social-btn" type="button" data-provider="Microsoft" aria-label="Continue with Microsoft">
              <span class="social-mark" aria-hidden="true">
                <svg class="microsoft-svg" width="18" height="18" viewBox="0 0 18 18">
                  <rect x="1" y="1" width="7.4" height="7.4" fill="#F25022"/>
                  <rect x="9.6" y="1" width="7.4" height="7.4" fill="#7FBA00"/>
                  <rect x="1" y="9.6" width="7.4" height="7.4" fill="#00A4EF"/>
                  <rect x="9.6" y="9.6" width="7.4" height="7.4" fill="#FFB900"/>
                </svg>
              </span>
              <span>Microsoft</span>
            </button>
            <button class="social-btn" type="button" data-provider="Facebook" aria-label="Continue with Facebook">
              <span class="social-mark" aria-hidden="true">
                <svg class="facebook-svg" width="20" height="20" viewBox="0 0 20 20">
                  <circle cx="10" cy="10" r="10" fill="#1877F2"/>
                  <path fill="#fff" d="M11.2 16v-5.4h1.8l.3-2.1h-2.1V7.1c0-.6.2-1 1.1-1h1.1V4.2c-.2 0-1-.1-1.8-.1-1.8 0-3 1.1-3 3v1.4H6.7v2.1h1.9V16h2.6z"/>
                </svg>
              </span>
              <span>Facebook</span>
            </button>
          </div>
        </form>
      </div>

      <p class="login-signup">Don't have an account? <a href="#">Sign up</a></p>
    </section>

    <div class="medtek-watermark" aria-hidden="true">
      <span class="medtek-mark">M</span>
      <span>MedTek</span>
    </div>
  </main>

<script src="../../Controllers/loginController.js"></script>
</body>
</html>
